[package]
name = "haunted_doors"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Haunted Doors: a provably fair trick-or-treat game on the Tari Ootle with a Merkle-sealed layout, one-time keys and stealth payouts."

[dependencies]
tari_template_lib = { version = "0.34.0" }
minicbor = { version = "2.3", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
tari_template_test_tooling = "0.46"
tari_template_lib_types = "0.34.0"
tari_ootle_common_types = "0.46"
sha2 = "0.10"
tari_bor = "0.16"
tari_utilities = "0.10"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0
[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
